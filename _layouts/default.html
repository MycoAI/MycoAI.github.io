<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
<head>
<meta charset="{{ site.encoding }}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
<meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131415" media="(prefers-color-scheme: dark)">
<script>
  // Before the first paint: apply the visitor's own theme choice (theme button), if any.
  // Without a choice the stylesheet follows the system setting.
  (function () {
    var root = document.documentElement;
    root.className += " has-js";
    try {
      var t = localStorage.getItem("mycoai-theme");
      if (t === "light" || t === "dark") root.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
{% seo title=false %}
<link rel="preload" href="{{ "/assets/fonts/manrope-latin-wght-normal.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ "/assets/css/site.css" | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/img/favicon-32.png" | relative_url }}">
<link rel="apple-touch-icon" href="{{ "/assets/img/apple-touch-icon.png" | relative_url }}">
{% feed_meta %}
{% if page.mathjax or site.mathjax %}
<link rel="stylesheet" href="{{ "/assets/katex/katex.min.css" | relative_url }}">
<script defer src="{{ "/assets/katex/katex.min.js" | relative_url }}"></script>
<script defer src="{{ "/assets/katex/contrib/auto-render.min.js" | relative_url }}" onload="renderMathInElement(document.body)"></script>
{% endif %}
{%- if page.url == "/" %}
<script defer src="{{ "/assets/js/hero3d.js" | relative_url }}"></script>
{%- endif %}
</head>
<body>
{% include header.html %}

<main id="main">
{{ content }}
</main>

{% include footer.html %}
</body>
</html>
