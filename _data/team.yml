# Team members page and the home page team preview.
#
# Per person:
#   name, role     shown on the cards (new labels, see _private/new-text.md)
#   status         current | alumni  (current members are also shown on the home page)
#   period         e.g. "2023–2024", or "2025–" for current members (optional)
#   order          sort order on the page; people with the same order are sorted by name
#   photo          photos/team/<file>, 400x400 (without a photo the initials are shown)
#   bio            original page text (HTML allowed)
#   links          optional: github, scholar, linkedin, x, orcid, website
#   author_names   spellings of the name in _data/publications.yml, shown in bold there
- name: Duong Vu
  status: current
  order: 1
  role: Bioinformatics researcher, Westerdijk Fungal Biodiversity Institute
  photo: photos/team/duong-vu.jpg
  bio: |-
    Duong Vu obtained a PhD in Computer Science from the University of Amsterdam in 2007. Since 2009, she has transitioned to Life Sciences, working at the Westerdijk Fungal Biodiversity Institute as a bioinformatics researcher.
    Her research focuses on developing computational methodologies and employing AI to identify fungi and microbes quickly and accurately from environmental and clinical samples, as well as gaining insights into biological processes.
  links:
    github: https://github.com/vuthuyduong
    scholar: https://scholar.google.com/citations?user=ugNE8zUAAAAJ&hl=nl
    x: https://x.com/Duong_Thuy_Vu
    linkedin: https://www.linkedin.com/in/duong-vu-9a6b3bb7/
  author_names:
  - Duong Vu
  - Vu D
  - D Vu
  - D. Vu
- name: Duc Anh Nguyen
  status: current
  order: 2
  role: Software engineer, Westerdijk Fungal Biodiversity Institute
  bio: >-
    Duc Anh Nguyen is a software engineer at the Westerdijk Fungal Biodiversity Institute,
    where he joined MycoAI in 2026 to build the software and data infrastructure
    for MycoBase, an open online resource for mycology funded by Open Science NL.
    He obtained a PhD in Data Science from Leiden University as a Marie Skłodowska-Curie
    fellow in the ECOLE project, working on automated machine learning with Honda Research
    Institute Europe, NEC Europe and Tata Steel. Before that, he spent eight years developing
    management information systems for the manufacturing and construction industries in Vietnam.
  photo: photos/team/duc-anh-nguyen.jpg
  links:
    github: https://github.com/anh05
    scholar: https://scholar.google.com/citations?user=IE9UpFIAAAAJ
    linkedin: https://www.linkedin.com/in/anh05
    
  author_names:
  - Duc Anh Nguyen
  - Nguyen DA
  - D A Nguyen

- name: Luka Ivkovic
  status: current  
  order: 3
  role: Fungal Data Scientist & Community Coordinator, Westerdijk Fungal Biodiversity Institute
  photo: photos/team/luka-ivkovic.png
  bio: |-
    Luka Ivkovic is a Fungal Data Scientist & Community Coordinator at the Westerdijk Fungal Biodiversity Institute, working across MycoBase and FUNGI-NL. He contributes to the development of open, FAIR and reproducible fungal research infrastructure by integrating diverse fungal data, developing and maintaining data and bioinformatics workflows, and supporting metadata, standards, interoperability, data pipelines and APIs. His work connects technical infrastructure with the needs of researchers and the wider fungal community through user engagement, documentation, training and knowledge sharing. The overall goal is to make fungal data, software and research resources more accessible, interoperable, reusable and useful across the community.
  links:
    github: https://github.com/LukaIvkovicc
    linkedin: https://www.linkedin.com/in/luka-ivkovic-1a1118290
    Email: mailto:l.ivkovic@wi.knaw.nl

- name: Biao Wang
  status: current
  order: 3
  period: "July 2026– March 2027"
  role: Visiting PhD Researcher on Microbiology, Westerdijk Fungal Biodiversity Institute
  photo: photos/team/biao-wang.png
  bio: |-
    Biao Wang is a visiting PhD researcher at the Westerdijk Fungal Biodiversity Institute, fully funded by the China Scholarship Council (CSC). He is a PhD candidate in Environmental Science at the Institute of Hydrobiology, Chinese Academy of Sciences. Combining field investigations, chemical analysis and eDNA techniques, his research focuses on the scale-dependent responses of epilithic biofilm communities to habitat changes in alpine streams.
  links:
    researchgate: https://www.researchgate.net/profile/Biao-Wang-38
