- name: Theofylakti Politi
  status: current
  
  order: 4
  role: Erasmus+ Bioinformatics Intern, Westerdijk Fungal Biodiversity Institute
  photo: photos/team/theofylakti-politi.png
  bio: |-
    Theofylakti Politi is an Erasmus+ Bioinformatics Intern at the Westerdijk Fungal Biodiversity Institute, where she builds open-source pipelines to make DNA metabarcoding faster and fully automated; her project will contribute to the FUNGI-NL initiative. She aims to work on data with Python and R to create reproducible workflows for fungal species identification and biodiversity analysis.


  links:
