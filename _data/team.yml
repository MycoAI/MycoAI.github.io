- name: Duong Vu
  role: Bioinformatics researcher, Westerdijk Fungal Biodiversity Institute
  photo: https://MycoAI.github.io/photos/portrait_DuongVu.jpg
  author_names:
  - Duong Vu
  - Vu D
  - D Vu
  - D. Vu
  bio: |-
    Duong Vu obtained a PhD in Computer Science from the University of Amsterdam in 2007. Since 2009, she has transitioned to Life Sciences, working at the Westerdijk Fungal Biodiversity Institute as a bioinformatics researcher.
    Her research focuses on developing computational methodologies and employing AI to identify fungi and microbes quickly and accurately from environmental and clinical samples, as well as gaining insights into biological processes.
