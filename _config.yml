title: "MycoAI's website"
author: "MycoAI's team"
description: "Using AI to uncover patterns in fungal biodiversity."
url: "https://mycoai.github.io"
lang: "en"
logo: "/photos/logo31_dutch_biodiversity_MycoAI.png"

# Layout

show_excerpts: true        # show article excerpts on the Blogs page

# Menu

navigation:                # accepts {file, title, url, icon, sidebaricon}
  - {title: "Home", file: "index.md"}
  - {title: "Blogs", file: "blogs.html"}
  - {title: "Software/Tools", file: "tools.md"}
  - {title: "Publications", file: "publications.md"}
  - {title: "Team members", file: "team.md"}
  - {title: "Projects", icon: github, url: "https://github.com/MycoAI"}
  
external:                  # shows a footer with social links - for available icons see fontawesome.com/icons
  - {title: Mail, icon: envelope, url: "mailto:d.vu@wi.knaw.nl"}
  - {title: WI, icon: rss, url: "https://wi.knaw.nl/"}
  - {title: Github, icon: github, url: "https://github.com/MycoAI"}

comments:
#  disqus_shortname: ""    # see https://disqus.com/
#  isso_domain: ""         # see https://posativ.org/isso/

plugins:
 - jekyll-feed
 - jekyll-seo-tag
 - jekyll-sitemap

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
  - docs
